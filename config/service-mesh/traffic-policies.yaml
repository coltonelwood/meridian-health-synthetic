# Traffic Management Policies
# Meridian Health Technologies
#
# Canary deployment weights and traffic routing rules.
# Used by ArgoCD Rollouts for gradual rollouts of new service versions.
#
# Last updated: 2025-03
# Owner: Platform Team

---
# Canary rollout for patient-service
# New versions roll out 10% -> 25% -> 50% -> 75% -> 100%
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: patient-service-canary
  namespace: production
  labels:
    app: patient-service
    managed-by: argo-rollouts
spec:
  hosts:
    - patient-service.production.svc.cluster.local
  http:
    - route:
        - destination:
            host: patient-service.production.svc.cluster.local
            subset: stable
          weight: 100
        - destination:
            host: patient-service.production.svc.cluster.local
            subset: canary
          weight: 0

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: patient-service-subsets
  namespace: production
spec:
  host: patient-service.production.svc.cluster.local
  subsets:
    - name: stable
      labels:
        rollouts-pod-template-hash: stable
    - name: canary
      labels:
        rollouts-pod-template-hash: canary

