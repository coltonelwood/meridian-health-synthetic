# =============================================================================
# AlertManager Configuration
# =============================================================================
#
# Routes alerts from Prometheus to Slack and PagerDuty based on severity
# and team ownership.
#
# Alert flow:
# 1. Prometheus evaluates rules -> fires alert
# 2. AlertManager receives alert
# 3. AlertManager routes based on labels (severity, team)
# 4. Notifications sent to appropriate channel
#
# Slack channels:
# - #alerts-critical: Critical alerts (paging)
# - #alerts-warning: Warning alerts (non-paging)
# - #claims-alerts: Claims-specific alerts for revenue cycle team
# - #security-alerts: Security team alerts (restricted channel)

global:
  resolve_timeout: 5m
  slack_api_url: 'https://hooks.slack.com/services/TXXXXX/BXXXXX/XXXXXXXXXX'
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

# Inhibit rules: suppress less severe alerts when more severe ones exist
inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ['service', 'alertname']

  # Don't send claim alerts if the database is down
  - source_matchers:
      - alertname = ServiceDown
      - service = database
    target_matchers:
      - team = revenue-cycle

route:
  receiver: default-slack
  group_by: ['alertname', 'service', 'team']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical alerts -> PagerDuty + Slack
    - matchers:
        - severity = critical
      receiver: pagerduty-critical
      group_wait: 10s
      repeat_interval: 1h
      routes:
        # Security critical alerts get special handling
        - matchers:
            - team = security
          receiver: pagerduty-security
          group_wait: 0s
          repeat_interval: 30m

    # Revenue cycle alerts -> dedicated Slack channel + PagerDuty during business hours
    - matchers:
        - team = revenue-cycle
      receiver: slack-claims
      group_wait: 1m
      repeat_interval: 2h
      routes:
        - matchers:
            - severity = critical
          receiver: pagerduty-revcycle

    # Warning alerts -> Slack only
    - matchers:
        - severity = warning
      receiver: slack-warning
      group_wait: 1m
      repeat_interval: 4h

    # Security warnings
    - matchers:
        - team = security
        - severity = warning
      receiver: slack-security
      group_wait: 30s
      repeat_interval: 2h

receivers:
  - name: default-slack
    slack_configs:
      - channel: '#alerts-warning'
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }} - {{ .Labels.severity }}
          *Service:* {{ .Labels.service }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}

  - name: pagerduty-critical
    pagerduty_configs:
      - service_key: '<platform-service-key>'
        severity: critical
        description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'
        details:
          service: '{{ .GroupLabels.service }}'
          description: '{{ .CommonAnnotations.description }}'
          runbook: '{{ .CommonAnnotations.runbook_url }}'
    slack_configs:
      - channel: '#alerts-critical'
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        title: ':rotating_light: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Severity:* `{{ .Labels.severity }}`
          *Service:* {{ .Labels.service }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}

  - name: pagerduty-revcycle
    pagerduty_configs:
      - service_key: '<revcycle-service-key>'
        severity: critical
    slack_configs:
      - channel: '#claims-alerts'
        send_resolved: true
        color: danger
        title: ':warning: Claims Alert: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

  - name: pagerduty-security
    pagerduty_configs:
      - service_key: '<security-service-key>'
        severity: critical
    slack_configs:
      - channel: '#security-alerts'
        send_resolved: true
        color: danger
        title: ':lock: Security Alert: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Description:* {{ .Annotations.description }}
          *Action Required:* Check HIPAA incident response procedures
          {{ end }}

  - name: slack-claims
    slack_configs:
      - channel: '#claims-alerts'
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

  - name: slack-warning
    slack_configs:
      - channel: '#alerts-warning'
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Service:* {{ .Labels.service }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

  - name: slack-security
    slack_configs:
      - channel: '#security-alerts'
        send_resolved: true
        title: ':shield: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

# Templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'
