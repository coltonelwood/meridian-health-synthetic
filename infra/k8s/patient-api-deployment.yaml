apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-api
  namespace: meridian
  labels:
    app: patient-api
    app.kubernetes.io/name: patient-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: meridian-health
    contains-phi: "true"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: patient-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: patient-api
        app.kubernetes.io/name: patient-api
        contains-phi: "true"
      annotations:
        # Prometheus scraping
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
        # Force restart on config change
        checksum/config: "{{ include (print $.Template.BasePath \"/configmap.yaml\") . | sha256sum }}"
    spec:
      serviceAccountName: patient-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      # Anti-affinity: spread pods across nodes for HA
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - patient-api
                topologyKey: kubernetes.io/hostname

      containers:
        - name: patient-api
          image: meridian/patient-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
              name: http
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: SERVICE_NAME
              value: "patient-api"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: meridian-config
                  key: log-level
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: meridian-config
                  key: db-host
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "meridian"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: meridian-config
                  key: redis-host
            - name: REDIS_PORT
              value: "6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: ENABLE_FHIR_R4
              valueFrom:
                configMapKeyRef:
                  name: meridian-config
                  key: feature-fhir-r4

          # Startup probe: gives the app time to initialize
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2

          # Liveness probe: restart if unhealthy
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe: remove from LB if not ready
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          # Security context per container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-logs
              mountPath: /app/logs

      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-logs
          emptyDir: {}

      # Graceful shutdown
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: patient-api
  namespace: meridian
  labels:
    app: patient-api
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: patient-api

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: patient-api
  namespace: meridian
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: patient-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patient-api
  namespace: meridian
  annotations:
    # IRSA: maps to AWS IAM role for accessing secrets, S3, etc.
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/meridian-patient-api

---
# Allow ingress from the ingress controller and other meridian services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: patient-api-ingress
  namespace: meridian
spec:
  podSelector:
    matchLabels:
      app: patient-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 3000
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: meridian-health
      ports:
        - port: 3000
          protocol: TCP
