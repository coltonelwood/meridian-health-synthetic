# =============================================================================
# ExternalSecrets Configuration
# =============================================================================
#
# We use ExternalSecrets Operator to sync secrets from AWS Secrets Manager
# into Kubernetes secrets. This way, actual secret values never appear in
# Git or in our Terraform state (well, they're in TF state for the SM
# secrets themselves, but at least not in K8s manifests).
#
# IMPORTANT: This file does NOT contain actual secrets. It references
# AWS Secrets Manager paths. If you need to rotate a secret, do it in
# AWS Secrets Manager and the ExternalSecrets operator will sync it.
#
# Secret rotation schedule:
# - Database passwords: every 90 days (automated via AWS)
# - JWT secrets: every 180 days (manual, requires coordinated deployment)
# - API keys: per vendor requirements
# - Redis auth: every 90 days (automated)

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: meridian
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: meridian
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: meridian/production/database
        property: username
    - secretKey: password
      remoteRef:
        key: meridian/production/database
        property: password
    - secretKey: host
      remoteRef:
        key: meridian/production/database
        property: host

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jwt-secret
  namespace: meridian
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: jwt-secret
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: meridian/production/jwt
        property: secret
    - secretKey: refresh-secret
      remoteRef:
        key: meridian/production/jwt
        property: refresh-secret

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: clearinghouse-credentials
  namespace: meridian
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: clearinghouse-credentials
    creationPolicy: Owner
  data:
    - secretKey: change-healthcare-key
      remoteRef:
        key: meridian/production/clearinghouse
        property: change-healthcare-api-key
    - secretKey: availity-key
      remoteRef:
        key: meridian/production/clearinghouse
        property: availity-api-key

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rabbitmq-credentials
  namespace: meridian
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: rabbitmq-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: meridian/production/rabbitmq
        property: username
    - secretKey: password
      remoteRef:
        key: meridian/production/rabbitmq
        property: password

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-credentials
  namespace: meridian
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: redis-credentials
    creationPolicy: Owner
  data:
    - secretKey: auth-token
      remoteRef:
        key: meridian/production/redis
        property: auth-token

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: meridian
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/meridian-external-secrets
