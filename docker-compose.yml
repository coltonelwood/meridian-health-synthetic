  #   environment:
  #     <<: *common-env
  #     SERVICE_NAME: billing
  #     PORT: 3008
  #     DATABASE_URL: postgres://meridian:meridian_dev_2024@postgres:5432/meridian_billing
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  # TODO: Add ml-scoring-service when we containerize the Python services
  # Currently, the ML team runs these locally with conda. See ml/README.md
  # ml-scoring:
  #   build:
  #     context: ./ml
  #     dockerfile: Dockerfile
  #   container_name: meridian-ml-scoring
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     MODEL_PATH: /models/claims-fraud-v3.pkl
  #     DATABASE_URL: postgres://meridian:meridian_dev_2024@postgres:5432/meridian_analytics
  #   volumes:
  #     - ./ml/models:/models

  # Referral service - still in beta, enable if you're working on referrals
  # referral-service:
  #   <<: *service-defaults
  #   build:
  #     context: .
  #     dockerfile: services/referral-service/Dockerfile
  #     target: development
  #   container_name: meridian-referrals
  #   ports:
  #     - "3009:3009"
  #   environment:
  #     <<: *common-env
  #     SERVICE_NAME: referral-service
  #     PORT: 3009
  #     DATABASE_URL: postgres://meridian:meridian_dev_2024@postgres:5432/meridian_referrals

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  elasticsearch_data:
    driver: local
  minio_data:
    driver: local

networks:
  meridian-net:
    driver: bridge
    name: meridian-net
